name: Idempotent Mattermost Migration & Upgrade

on:
  push:
    branches: [ "migration" ]
  workflow_dispatch:

env:
  COMPOSE_FILE: docker-compose.prod.yml

jobs:
  migrate-and-deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. Проверка идемпотентности
      - name: Check Migration Status
        id: check_status
        shell: bash
        run: |
          if [ -f "$HOME/.mattermost_migration_completed" ]; then
            echo "✅ Database already migrated to PostgreSQL. Skipping data transfer."
            echo "already_migrated=true" >> "$GITHUB_OUTPUT"
          else
            echo "⚠️ Migration required."
            echo "already_migrated=false" >> "$GITHUB_OUTPUT"
          fi

      # 2. Создание резервной копии MySQL
      - name: Backup Legacy MySQL
        if: steps.check_status.outputs.already_migrated == 'false'
        shell: bash
        env:
          MYSQL_PWD: ${{ secrets.DB_MYSQL_ROOT_PASSWORD }}
        run: |
          echo "📦 Creating timestamped backup of MySQL..."
          BACKUP_NAME="mattermost_mysql_backup_${{ github.run_id }}.sql"
          if docker ps | grep -q "mattermost-mysql"; then
            docker exec -e MYSQL_PWD="$MYSQL_PWD" mattermost-mysql mysqldump -u root mattermost > "$BACKUP_NAME"
            echo "✅ Backup successfully saved as $BACKUP_NAME"
          else
            echo "❌ Error: Legacy MySQL container is not running!"
            exit 1
          fi

      # 3. Поднятие целевого контейнера PostgreSQL и инициализация схемы
      - name: Start Target PostgreSQL & Init Schema
        if: steps.check_status.outputs.already_migrated == 'false'
        shell: bash
        env:
          DB_POSTGRES_PASSWORD: ${{ secrets.DB_POSTGRES_PASSWORD }}
        run: |
          docker compose -f "$COMPOSE_FILE" up -d db-postgres
          echo "⏳ Waiting for PostgreSQL to initialize..."
          sleep 10
          docker run -d --name mm95-init --network=mattermost_network \
            -e MM_SQLSETTINGS_DRIVERNAME=postgres \
            -e MM_SQLSETTINGS_DATASOURCE="postgres://postgres:${DB_POSTGRES_PASSWORD}@mattermost-postgres:5432/mattermost?sslmode=disable" \
            mattermost/mattermost-team-edition:9.5
          sleep 15
          docker stop mm95-init && docker rm mm95-init
          docker exec mattermost-postgres psql -U postgres -d mattermost -c 'DO $body$ DECLARE r RECORD; BEGIN FOR r IN (SELECT tablename FROM pg_tables WHERE schemaname = $$public$$ AND tablename != $$db_migrations$$) LOOP EXECUTE $$TRUNCATE TABLE $$ || quote_ident(r.tablename) || $$ CASCADE$$; END LOOP; END $body$;'
          docker exec mattermost-postgres psql -U postgres -d mattermost -c "ALTER SCHEMA public RENAME TO mattermost;"

      # 4. Гетерогенная миграция данных с помощью pgloader
      - name: Run pgloader (With Downcase Identifiers)
        if: steps.check_status.outputs.already_migrated == 'false'
        shell: bash
        run: |
          echo "🔄 Migrating data from MySQL to PostgreSQL..."
          MSYS_NO_PATHCONV=1 docker run --rm --network=mattermost_network \
            -v "$(pwd)/migrate.load:/migrate.load" \
            mattermost/mattermost-pgloader:latest pgloader /migrate.load
          docker exec mattermost-postgres psql -U postgres -d mattermost -c "ALTER SCHEMA mattermost RENAME TO public;"


      # 5. Установка маркерного флаг-файла успешной миграции
      - name: Mark Migration as Completed
        if: steps.check_status.outputs.already_migrated == 'false'
        shell: bash
        run: touch "$HOME/.mattermost_migration_completed"

      # 6. Развертывание обновленного продакшн-стека
      - name: Deploy Upgraded Stack
        shell: bash
        env:
          DB_POSTGRES_PASSWORD: ${{ secrets.DB_POSTGRES_PASSWORD }}
        run: |
          echo "🚀 Launching Upgraded Mattermost Stack..."
          docker stop mattermost || true
          docker rm mattermost || true
          docker compose -f "$COMPOSE_FILE" up -d --build --remove-orphans
          echo "⏳ Waiting for Mattermost to apply internal database updates..."
          sleep 30

      # 7. Автоматическое тестирование работоспособности
      - name: Run Health Checks & Verify Data
        shell: bash
        run: |
          echo "🧪 Running Smoke Tests..."
          if curl -f http://localhost:8065/api/v4/system/ping; then
            echo "✅ Mattermost upgraded successfully and running on Postgres!"
          else
            echo "❌ Application health check failed. Fetching logs..."
            docker compose -f "$COMPOSE_FILE" logs
            exit 1
          fi